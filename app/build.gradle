plugins {
    id 'com.android.application'
}

import java.security.MessageDigest

android {
    namespace = 'com.ghostpanter.scrcpy'
    compileSdk 34
    // Pin build-tools explicitly so the aapt2/zipalign/d8 toolchain is
    // fixed and builds stay reproducible, not whatever AGP defaults to.
    // compileSdk is 34 for ColorOS; build-tools 35.0.0 remains AGP-safe.
    buildToolsVersion '35.0.0'

    defaultConfig {
        // The published package id. Immutable across releases.
        applicationId 'com.ghostpanter.scrcpy'
        minSdk 28
        targetSdk 34
        versionCode 36
        versionName '0.5.25-tablet'
    }

    // AGP otherwise embeds a Google-signed dependency-metadata blob in the
    // APK that is not byte-reproducible. Strip it so the build stays
    // deterministic. This is the single most common reproducible-build
    // breaker on AGP.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // Release signing pulls credentials from the environment. Set all
    // four of KEYSTORE_PATH / KEYSTORE_PASS / KEY_ALIAS / KEY_PASS and
    // assembleRelease produces a signed APK. With any of them missing
    // the release build is unsigned (Gradle's default); the same
    // all-four condition gates the buildTypes wiring below so a
    // half-set environment cannot select a half-populated config.
    def signingReady = ['KEYSTORE_PATH', 'KEYSTORE_PASS', 'KEY_ALIAS', 'KEY_PASS']
            .every { System.getenv(it) }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile     file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias      System.getenv('KEY_ALIAS')
                keyPassword   System.getenv('KEY_PASS')
                // V1+V2 required for ColorOS / OEM installers. apksigner
                // reports "v1 scheme: false" when minSdk>=24 even though
                // META-INF JAR signatures are present and valid — verify
                // with: apksigner verify --min-sdk-version 23 --verbose
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    // Ship one ordinary APK containing both supported 64-bit ABIs. arm64
    // covers physical devices; x86_64 covers emulators and ChromeOS without
    // introducing split-APK installation logic.
    buildTypes {
        debug {
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        release {
            // ColorOS: do not embed version-control-info.textproto under META-INF
            // (unprotected by V1 JAR signature; OEM verifiers may reject it).
            vcsInfo {
                include false
            }
            // x86_64 is here so the emulator can install and RUN the
            // minified artifact. Without it no tier ever executed the
            // variant that ships, and an R8 misconfiguration - a keep
            // rule that is too narrow, a reflective edge R8 could not
            // see - would first show up on a user's device. It costs a
            // second ABI in the APK and buys coverage of the only build
            // that matters.
            //
            // This is why the APK is multi-MB while the dex shrank: it
            // carries two copies of libconscrypt_jni.so and libspake2.so.
            // ColorOS-compat builds use jniLibs.useLegacyPackaging so the
            // libs are compressed and extracted on install (extractNativeLibs
            // true). A single-ABI build is smaller; splits are the next step
            // if download size starts to matter.
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
            minifyEnabled   true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (signingReady) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // ColorOS / OEM PackageManagers often fail INSTALL_FAILED_INVALID_APK
        // when extractNativeLibs=false and page-aligned uncompressed .so files
        // are present (16 KiB align is correct for AOSP, but ColorOS installers
        // have historically choked). Legacy packaging compresses jniLibs and
        // sets extractNativeLibs=true so the system extracts them on install.
        jniLibs {
            useLegacyPackaging = true
        }
        // bouncycastle (transitive via :adb) is the dominant source of
        // dead weight in the APK. Each entry below is dead code/data for
        // our use case (we only call BC's asn1, crypto, util.encoders):
        //   - picnic post-quantum lookup tables: ~1.2 MB of .properties
        //   - cert-path-reviewer i18n messages: ~92 KB, en+de only
        //   - duplicate META-INF licenses/notices: ordinary AGP cleanup
        // Also drop AGP metadata blobs under META-INF/ that are not covered
        // by the V1 JAR signature (apksigner warns; some OEM verifiers are
        // stricter about unprotected META-INF entries).
        resources.excludes += [
            'META-INF/LICENSE*',
            'META-INF/NOTICE*',
            'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
            'META-INF/com/android/build/gradle/app-metadata.properties',
            'META-INF/version-control-info.textproto',
            'org/bouncycastle/pqc/crypto/picnic/**',
            'org/bouncycastle/pqc/legacy/picnic/**',
            'org/bouncycastle/x509/CertPathReviewerMessages*.properties',
        ]
    }

    testOptions {
        // android.util.Log and friends are stubs on the JVM unit-test
        // classpath; let them return defaults instead of throwing.
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.assets.srcDir '../vendor/libadb-android/LICENSES'
    }

    // Name APK after root project (scrcpy-android), not "app-debug.apk".
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def vName = variant.versionName ?: "dev"
            output.outputFileName = "${rootProject.name}-${vName}-${variant.buildType.name}.apk"
        }
    }
}

// Guard: never ship an unsigned release APK. Without KEYSTORE_* AGP still
// produces a .apk that PackageInstaller rejects ("App not installed" /
// parse error). Fail early so a release cannot upload a broken artifact.
afterEvaluate {
    def signingReady = ['KEYSTORE_PATH', 'KEYSTORE_PASS', 'KEY_ALIAS', 'KEY_PASS']
            .every { System.getenv(it) }
    tasks.named('assembleRelease').configure {
        doFirst {
            if (!signingReady) {
                throw new GradleException(
                    'assembleRelease requires KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS. '
                    + 'Refusing to build an unsigned release APK.')
            }
        }
    }
}


dependencies {
    implementation project(':adb')
    // bcprov is already pulled in transitively by :adb at runtime; we
    // need it on the compile classpath too for Adb.java's ASN.1
    // cert-builder. :adb keeps it 'implementation'-scoped upstream so
    // we declare it explicitly here rather than patch the vendor tree.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.84'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def serverJar = file('src/main/assets/scrcpy-server.jar')
def serverSum = file('src/main/assets/scrcpy-server.sha256')
def serverVersion = file('src/main/assets/scrcpy-server.version')
def expectedServerSum = providers.gradleProperty('scrcpyServerSha256')
        .orElse(providers.provider { serverSum.text.trim() })

tasks.register('verifyScrcpyServer') {
    inputs.files(serverJar, serverSum, serverVersion)
    inputs.property('expectedChecksum', expectedServerSum)
    doLast {
        if (!serverJar.isFile() || !serverSum.isFile() || !serverVersion.isFile()) {
            throw new GradleException('scrcpy server assets are incomplete; run scripts/update-server')
        }
        def expected = expectedServerSum.get()
        def version = serverVersion.text.trim()
        if (!(expected ==~ /[0-9a-f]{64}/)
                || !(version ==~ /[0-9]+(\.[0-9]+)*/)) {
            throw new GradleException('scrcpy server checksum or version is invalid')
        }
        def digest = MessageDigest.getInstance('SHA-256')
        serverJar.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            for (int n; (n = input.read(buffer)) >= 0; ) {
                if (n == 0) throw new GradleException('scrcpy server read made no progress')
                digest.update(buffer, 0, n)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expected) {
            throw new GradleException("scrcpy server checksum mismatch: expected ${expected}, got ${actual}")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn tasks.named('verifyScrcpyServer')
    }
}
